{% load static %}
<section class="section section--certificates" id="certificates" aria-labelledby="certificates-title">
  <div class="wrap certificates">
    <div class="certificates__text">
      <header class="section__head" data-reveal>
        <span class="section__index" aria-hidden="true">٠٧</span>
        <h2 class="section__title" id="certificates-title">شهادات الإتمام</h2>
      </header>
      <p class="lede" data-reveal data-reveal-delay="1">
        تُصدر المدرسة شهادةَ إتمامٍ عند إنهاء بعض المقررات، وشهادةً لإتمام المسار كاملًا، تُوثَّق برقمٍ يمكن التحقق منه.
      </p>
    </div>

    <figure class="certificate" data-reveal data-reveal-delay="2">
      <div class="certificate__frame">
        <img class="certificate__mark" src="{% static 'ribaat/img/ribaat-mark.png' %}" alt="" width="1490" height="426" loading="lazy" decoding="async" aria-hidden="true">
        <p class="certificate__kicker">رباط الحنابلة</p>
        <p class="certificate__title">شهادة إتمام مسار</p>
        <p class="certificate__rule" aria-hidden="true"></p>
        <p class="certificate__field is-placeholder">اسم الطالب</p>
        <p class="certificate__course">مسار العقيدة</p>
        <dl class="certificate__meta">
          <div><dt>رقم التوثيق</dt><dd class="mono">RB-2026-000184</dd></div>
          <div><dt>التاريخ</dt><dd>سبتمبر ٢٠٢٦</dd></div>
        </dl>
      </div>
      <figcaption class="certificate__caption">نموذجٌ توضيحي لشهادة إتمام المسار.</figcaption>
    </figure>
  </div>
</section>
