{% comment %}One label/value line inside a data box. Params: label, value{% endcomment %}<tr>
  <td class="e-sub" width="40%" style="width:40%;direction:rtl;text-align:right;vertical-align:top;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;font-size:13px;line-height:22px;mso-line-height-rule:exactly;color:#82795F;padding:8px 0;">{{ label }}</td>
  <td class="e-txt" width="60%" style="width:60%;direction:rtl;text-align:left;vertical-align:top;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;font-weight:600;line-height:22px;mso-line-height-rule:exactly;color:#211F19;padding:8px 0;">{{ value }}</td>
</tr>
