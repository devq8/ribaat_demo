document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ious\n   with that pair — a warm, paper-like, academic register (no cool grays). */\n:root {\n  /* ---- Base: brand ---- */\n  --ribaat-green-900: #2E3A24;\n  --ribaat-green-800: #3E4E32;\n  --ribaat-green-700: #4F6140;\n  --ribaat-green-600: #607247; /* brand primary — exact PDF value */\n  --ribaat-green-500: #728759;\n  --ribaat-green-400: #8FA079;\n  --ribaat-green-300: #B2C0A2;\n  --ribaat-green-200: #D4DCC9;\n  --ribaat-green-100: #EBEFE4;\n  --ribaat-green-50:  #F5F7F0;\n\n  --ribaat-brown-900: #4A3A22;\n  --ribaat-brown-800: #63492A;\n  --ribaat-brown-700: #79552F;\n  --ribaat-brown-600: #8C5F35; /* brand accent — exact PDF value */\n  --ribaat-brown-500: #A47846;\n  --ribaat-brown-400: #BB9868;\n  --ribaat-brown-300: #D3BC98;\n  --ribaat-brown-200: #E7DBC4;\n  --ribaat-brown-100: #F3EBDD;\n\n  /* ---- Base: neutrals (warm parchment, not cool gray) ---- */\n  --ribaat-ink-900: #211F19;\n  --ribaat-ink-800: #333026;\n  --ribaat-ink-700: #494434;\n  --ribaat-ink-600: #635C48;\n  --ribaat-ink-500: #82795F;\n  --ribaat-ink-400: #A69C81;\n  --ribaat-ink-300: #C9BFA6;\n  --ribaat-ink-200: #E2DAC5;\n  --ribaat-ink-100: #EFEADB;\n  --ribaat-paper-050: #FBF9F3;\n  --ribaat-paper-000: #FFFEFA;\n\n  /* ---- Base: semantic hues (muted, never neon) ---- */\n  --ribaat-red-600: #A6473B;\n  --ribaat-red-100: #F4E3DF;\n  --ribaat-amber-600: #A97A24;\n  --ribaat-amber-100: #F3E7CC;\n  --ribaat-blue-600: #3E6B7A;\n  --ribaat-blue-100: #DEE9EB;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--ribaat-paper-050);\n  --surface-card: var(--ribaat-paper-000);\n  --surface-sunken: var(--ribaat-ink-100);\n  --surface-brand: var(--ribaat-green-600);\n  --surface-brand-strong: var(--ribaat-green-800);\n  --surface-accent: var(--ribaat-brown-600);\n  --surface-overlay: rgba(33, 31, 25, 0.55);\n\n  --border-subtle: var(--ribaat-ink-200);\n  --border-default: var(--ribaat-ink-300);\n  --border-strong: var(--ribaat-ink-500);\n  --border-brand: var(--ribaat-green-500);\n\n  --text-primary: var(--ribaat-ink-900);\n  --text-secondary: var(--ribaat-ink-600);\n  --text-muted: var(--ribaat-ink-500);\n  --text-on-brand: var(--ribaat-paper-000);\n  --text-on-accent: var(--ribaat-paper-000);\n  --text-brand: var(--ribaat-green-700);\n  --text-accent: var(--ribaat-brown-700);\n  --text-link: var(--ribaat-green-700);\n  --text-link-hover: var(--ribaat-green-800);\n\n  --state-success-fg: #3E6B4A;\n  --state-success-bg: var(--ribaat-green-100);\n  --state-warning-fg: var(--ribaat-amber-600);\n  --state-warning-bg: var(--ribaat-amber-100);\n  --state-danger-fg: var(--ribaat-red-600);\n  --state-danger-bg: var(--ribaat-red-100);\n  --state-info-fg: var(--ribaat-blue-600);\n  --state-info-bg: var(--ribaat-blue-100);\n\n  --focus-ring: var(--ribaat-green-500);\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Dark theme layer (ADDITION, proposed for upstream merge)\n   ------------------------------------------------------------------------\n   Built while designing ui_kits/student/StudentDashboard.dc.html. Not part\n   of the original system pass — flagged here so it can be folded into the\n   canonical token set once reviewed.\n\n   Approach: a single [data-theme=\"dark\"] attribute scope that overrides the\n   semantic aliases AND the specific base-ramp steps components consume\n   directly (badges/buttons reach into --ribaat-green-100/600/700 etc, not\n   just the aliases). Apply by setting data-theme=\"dark\" on any ancestor\n   element (typically the page root); everything under it repaints via the\n   existing var() references in colors.css — no component changes needed.\n\n   Direction: warm, muted dark — kept in the same olive/brown family as\n   light mode, never a cold near-black SaaS dark and never pure black.\n   Semantic (success/warning/danger/info) colors are desaturated the same\n   way the light versions are; nothing here uses saturated/neon hues. */\n\n[data-theme=\"dark\"] {\n  /* ---- Surfaces ---- */\n  --surface-page: #201E18;\n  --surface-card: #2B2820;\n  --surface-sunken: #1B1913;\n  --surface-brand: #6B8151;\n  --surface-brand-strong: #55663F;\n  --surface-accent: #96703F;\n  --surface-overlay: rgba(10, 9, 7, 0.6);\n\n  /* ---- Borders ---- */\n  --border-subtle: #3A362C;\n  --border-default: #4A4536;\n  --border-strong: #6B6551;\n  --border-brand: #7C9161;\n\n  /* ---- Text ---- */\n  --text-primary: #EDE6D6;\n  --text-secondary: #C4B99F;\n  --text-muted: #93876C;\n  --text-on-brand: #F7F3E7;\n  --text-on-accent: #F7F3E7;\n  --text-brand: #A9BE8F;\n  --text-accent: #D3B583;\n  --text-link: #A9BE8F;\n  --text-link-hover: #C3D6AC;\n\n  --focus-ring: #94A87A;\n\n  /* ---- Base ramp steps consumed directly by components ----\n     (Badge/Button/CourseCard/Avatar reach into these, not only the\n     aliases above — both layers must repaint together.) */\n  --ribaat-green-100: #33402A;\n  --ribaat-green-200: #3D4A31;\n  --ribaat-green-600: #7C9161;\n  --ribaat-green-700: #94A87A; /* lighter than 600 on purpose: dark-mode hover\n                                   should brighten, not darken toward bg */\n  --ribaat-green-800: #55663F;\n\n  --ribaat-brown-100: #3D3020;\n  --ribaat-brown-200: #493924;\n  --ribaat-brown-600: #96703F;\n  --ribaat-brown-700: #C9A876;\n\n  --ribaat-amber-100: #3A2F1C;\n  --ribaat-amber-600: #D3A85C;\n  --ribaat-red-100: #3C2420;\n  --ribaat-red-600: #D98A7C;\n  --ribaat-blue-100: #1F323A;\n  --ribaat-blue-600: #7FB6C7;\n\n  /* ---- Semantic state colors — muted/desaturated, same spirit as light ---- */\n  --state-success-bg: #2B3B27;\n  --state-success-fg: #8FBB85;\n  --state-warning-bg: #3A2F1C;\n  --state-warning-fg: #D3A85C;\n  --state-danger-bg: #3C2420;\n  --state-danger-fg: #D98A7C;\n  --state-info-bg: #1F323A;\n  --state-info-fg: #7FB6C7;\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Type tokens\n   RTL-first, Arabic-only v1. \"display\" = Amiri (Naskh serif, academic/\n   classical feel — headings, honorifics, Qur'an/Hadith citations).\n   \"sans\" = IBM Plex Sans Arabic (UI, body copy, forms, navigation). */\n:root {\n  --font-display: \"Amiri\", \"Times New Roman\", serif;\n  --font-sans: \"IBM Plex Sans Arabic\", \"Segoe UI\", Tahoma, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, monospace; /* certificate/course codes only — @font-face pending; brand should upload real font files */\n\n  /* Type scale — 1.25 ratio, base 16px */\n  --text-xs: 0.75rem;    /* 12px — meta, timestamps */\n  --text-sm: 0.875rem;   /* 14px — captions, form hints */\n  --text-base: 1rem;     /* 16px — body */\n  --text-md: 1.125rem;   /* 18px — lead paragraph */\n  --text-lg: 1.375rem;   /* 22px — card titles */\n  --text-xl: 1.75rem;    /* 28px — section headings */\n  --text-2xl: 2.25rem;   /* 36px — page titles */\n  --text-3xl: 3rem;      /* 48px — hero */\n\n  --leading-tight: 1.25;\n  --leading-normal: 1.55;  /* Arabic needs more line-height than Latin */\n  --leading-relaxed: 1.9;  /* Qur'an/Hadith citation blocks */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  --tracking-normal: 0; /* never use letter-spacing on Arabic script */\n}\n<\u002Fstyle>\n  <style>:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  --container-max: 1200px;\n  --container-padding: var(--space-6);\n}\n<\u002Fstyle>\n  <style>:root {\n  /* Corners — soft, calm, not overly rounded */\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n\n  /* Shadows — low elevation, warm-tinted (never pure black) */\n  --shadow-sm: 0 1px 2px rgba(33, 31, 25, 0.06);\n  --shadow-md: 0 4px 14px rgba(33, 31, 25, 0.08);\n  --shadow-lg: 0 12px 32px rgba(33, 31, 25, 0.12);\n\n  /* Motion — restrained, no bounce */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-normal: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  --border-width: 1px;\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Webfonts\n   Substitutions (no brand font files were provided):\n   - \"Amiri\" stands in for a classical Naskh display/heading face — used for\n     headings, honorifics, and Qur'an/Hadith citation blocks.\n   - \"IBM Plex Sans Arabic\" stands in for the UI/body face — used for all\n     interface text, forms, and navigation.\n   Flagged in readme.md — ask the brand team for real webfonts if they exist. */\n\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e38001af-cede-487b-b189-eb57b5e17d3f\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f633f3e4-63a6-4688-9971-d01c486929e4\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8881893b-914d-4ebc-ab9a-2abda141d497\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"44864490-c604-44f3-8e3d-34ef317f3a3d\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"096e149b-d0d2-45db-a653-c826f2719270\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 400;\n  font-disp ter (no cool grays). */\n:root {\n  /* ---- Base: brand ---- */\n  --ribaat-green-900: #2E3A24;\n  --ribaat-green-800: #3E4E32;\n  --ribaat-green-700: #4F6140;\n  --ribaat-green-600: #607247; /* brand primary — exact PDF value */\n  --ribaat-green-500: #728759;\n  --ribaat-green-400: #8FA079;\n  --ribaat-green-300: #B2C0A2;\n  --ribaat-green-200: #D4DCC9;\n  --ribaat-green-100: #EBEFE4;\n  --ribaat-green-50:  #F5F7F0;\n\n  --ribaat-brown-900: #4A3A22;\n  --ribaat-brown-800: #63492A;\n  --ribaat-brown-700: #79552F;\n  --ribaat-brown-600: #8C5F35; /* brand accent — exact PDF value */\n  --ribaat-brown-500: #A47846;\n  --ribaat-brown-400: #BB9868;\n  --ribaat-brown-300: #D3BC98;\n  --ribaat-brown-200: #E7DBC4;\n  --ribaat-brown-100: #F3EBDD;\n\n  /* ---- Base: neutrals (warm parchment, not cool gray) ---- */\n  --ribaat-ink-900: #211F19;\n  --ribaat-ink-800: #333026;\n  --ribaat-ink-700: #494434;\n  --ribaat-ink-600: #635C48;\n  --ribaat-ink-500: #82795F;\n  --ribaat-ink-400: #A69C81;\n  --ribaat-ink-300: #C9BFA6;\n  --ribaat-ink-200: #E2DAC5;\n  --ribaat-ink-100: #EFEADB;\n  --ribaat-paper-050: #FBF9F3;\n  --ribaat-paper-000: #FFFEFA;\n\n  /* ---- Base: semantic hues (muted, never neon) ---- */\n  --ribaat-red-600: #A6473B;\n  --ribaat-red-100: #F4E3DF;\n  --ribaat-amber-600: #A97A24;\n  --ribaat-amber-100: #F3E7CC;\n  --ribaat-blue-600: #3E6B7A;\n  --ribaat-blue-100: #DEE9EB;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--ribaat-paper-050);\n  --surface-card: var(--ribaat-paper-000);\n  --surface-sunken: var(--ribaat-ink-100);\n  --surface-brand: var(--ribaat-green-600);\n  --surface-brand-strong: var(--ribaat-green-800);\n  --surface-accent: var(--ribaat-brown-600);\n  --surface-overlay: rgba(33, 31, 25, 0.55);\n\n  --border-subtle: var(--ribaat-ink-200);\n  --border-default: var(--ribaat-ink-300);\n  --border-strong: var(--ribaat-ink-500);\n  --border-brand: var(--ribaat-green-500);\n\n  --text-primary: var(--ribaat-ink-900);\n  --text-secondary: var(--ribaat-ink-600);\n  --text-muted: var(--ribaat-ink-500);\n  --text-on-brand: var(--ribaat-paper-000);\n  --text-on-accent: var(--ribaat-paper-000);\n  --text-brand: var(--ribaat-green-700);\n  --text-accent: var(--ribaat-brown-700);\n  --text-link: var(--ribaat-green-700);\n  --text-link-hover: var(--ribaat-green-800);\n\n  --state-success-fg: #3E6B4A;\n  --state-success-bg: var(--ribaat-green-100);\n  --state-warning-fg: var(--ribaat-amber-600);\n  --state-warning-bg: var(--ribaat-amber-100);\n  --state-danger-fg: var(--ribaat-red-600);\n  --state-danger-bg: var(--ribaat-red-100);\n  --state-info-fg: var(--ribaat-blue-600);\n  --state-info-bg: var(--ribaat-blue-100);\n\n  --focus-ring: var(--ribaat-green-500);\n}\n\n/* Ribaat Design System — Type tokens\n   RTL-first, Arabic-only v1. \"display\" = Amiri (Naskh serif, academic/\n   classical feel — headings, honorifics, Qur'an/Hadith citations).\n   \"sans\" = IBM Plex Sans Arabic (UI, body copy, forms, navigation). */\n:root {\n  --font-display: \"Amiri\", \"Times New Roman\", serif;\n  --font-sans: \"IBM Plex Sans Arabic\", \"Segoe UI\", Tahoma, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, monospace; /* certificate/course codes only — @font-face pending; brand should upload real font files */\n\n  /* Type scale — 1.25 ratio, base 16px */\n  --text-xs: 0.75rem;    /* 12px — meta, timestamps */\n  --text-sm: 0.875rem;   /* 14px — captions, form hints */\n  --text-base: 1rem;     /* 16px — body */\n  --text-md: 1.125rem;   /* 18px — lead paragraph */\n  --text-lg: 1.375rem;   /* 22px — card titles */\n  --text-xl: 1.75rem;    /* 28px — section headings */\n  --text-2xl: 2.25rem;   /* 36px — page titles */\n  --text-3xl: 3rem;      /* 48px — hero */\n\n  --leading-tight: 1.25;\n  --leading-normal: 1.55;  /* Arabic needs more line-height than Latin */\n  --leading-relaxed: 1.9;  /* Qur'an/Hadith citation blocks */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --w quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;viewport&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;auto&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;auto&quot;, &quot;desktop&quot;, &quot;tablet&quot;, &quot;mobile&quot;], &quot;section&quot;: &quot;Breakpoint&quot;},\n  &quot;navigatorStyle&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;list&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;list&quot;, &quot;chips&quot;, &quot;grid&quot;], &quot;section&quot;: &quot;Question navigator&quot;},\n  &quot;navigatorTypeLabels&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Question navigator&quot;},\n  &quot;legendPlacement&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;hidden&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;outside&quot;, &quot;inside&quot;, &quot;hidden&quot;], &quot;section&quot;: &quot;Question navigator&quot;},\n  &quot;trueFalseStyle&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;compact&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;compact&quot;, &quot;segmented&quot;, &quot;tiles&quot;], &quot;section&quot;: &quot;Question types&quot;},\n  &quot;timed&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Exam config&quot;},\n  &quot;timerState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;low&quot;], &quot;section&quot;: &quot;Exam config&quot;},\n  &quot;allowFlagging&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Exam config&quot;},\n  &quot;resultsPolicy&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;later&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;later&quot;, &quot;immediate&quot;], &quot;section&quot;: &quot;Exam config&quot;},\n  &quot;startQuestion&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 5, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 1, &quot;max&quot;: 20, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;sheetOpen&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;live&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;}\n}\">\nconst QUESTIONS = [\n  { id: 1, type: \"mcq\", stem: \"من صنّف متن «الأربعين النووية»؟\",\n    options: [\"الإمام النووي رحمه الله\", \"الإمام ابن رجب الحنبلي رحمه الله\", \"الإمام ابن الصلاح رحمه الله\", \"الإمام ابن حجر العسقلاني رحمه الله\"] },\n  { id: 2, type: \"tf\", stem: \"حديث «إنما الأعمال بالنيات» رواه عمر بن الخطاب رضي الله عنه.\" },\n  { id: 3, type: \"mcq\", stem: \"كم عدد الأحاديث التي جمعها الإمام النووي رحمه الله في متنه؟\",\n    options: [\"أربعون حديثاً\", \"اثنان وأربعون حديثاً\", \"خمسون حديثاً\", \"ثمانية وعشرون حديثاً\"] },\n  { id: 4, type: \"short\", length: \"paragraph\", stem: \"اذكر أركان الإسلام الخمسة كما وردت في حديث ابن عمر رضي الله عنهما، مرتّبةً كما جاءت في الحديث.\",\n    hint: \"إجابة من ثلاثة أسطر تقريباً.\" },\n  { id: 5, type: \"mcq\", stem: \"قوله ﷺ: «الحلالُ بيّنٌ والحرامُ بيّنٌ وبينهما أمورٌ مشتبهات» — على أي أصل يدلّ هذا الحديث؟\",\n    options: [\"أصل الورع واتقاء الشبهات\", \"أصل الرخص في السفر\", \"أصل القياس في الأحكام\", \"أصل الإجماع\"] },\n  { id: 6, type: \"tf\", stem: \"محل النية القلب، ولا يُشرع التلفّظ بها.\" },\n  { id: 7, type: \"short\", length: \"line\", stem: \"من راوي حديث «الدِّينُ النصيحة»؟\", hint: \"اسم الصحابي مع الترضّي عنه.\" },\n  { id: 8, type: \"mcq\", stem: \"معنى قوله ﷺ: «من حُسن إسلام المرء تركُه ما لا يعنيه»:\",\n    options: [\"ترك ما لا فائدة فيه من قول أو فعل\", \"ترك العمل بالكلية\", \"ترك مخالطة الناس\", \"ترك طلب الرزق\"] },\n  { id: 9, type: \"tf\", stem: \"قوله ﷺ «كل بدعةٍ ضلالة» عامٌّ يشمل البدع في الدين كلَّها.\" },\n  { id: 10, type: \"mcq\", stem: \"قوله ﷺ: «دَعْ ما يَريبُك إلى ما لا يَريبُك» أصلٌ في:\",\n    options: [\"الورع\", \"التيسير\", \"البيع والشراء\", \"آداب المجلس\"] },\n  { id: 11, type: \"short\", length: \"paragraph\", stem: \"عرّف الإحسان كما ورد في حديث جبريل عليه السلام، مع بيان مرتبته من مراتب الدين.\",\n    hint: \"إجابة من ثلاثة أسطر تقريباً.\" },\n  { id: 12, type: \"mcq\", stem: \"حديث «إنما الأعمال بالنيات» أخرجه:\",\n    options: [\"البخاري ومسلم\", \"أبو داود وحده\", \"الترمذي وحده\", \"ابن ماجه والنسائي\"] },\n  { id: 13, type: \"tf\", stem: \"يشترط تجديد النية عند كل جزء من أجزاء العبادة.\" },\n  { id: 14, type: \"mcq\", stem: \"قوله ﷺ: «لا يؤمن أحدُكم حتى يُحبَّ لأخيه ما يحبُّ لنفسه» — نفي الإيمان هنا نفيٌ لـ:\",\n    options: [\"كمال الإيمان الواجب\", \"أصل الإيمان\", \"الإسلام الظاهر\", \"صحة الأعمال كلها\"] },\n  { id: 15, type: \"short\", length: \"paragraph\", stem: \"اذكر شرطَي قبول العمل عند أهل السنة، مع دليل مختصر لكلٍّ منهما.\",\n    hint: \"إجابة من أربعة أسطر تقريباً.\" },\n  { id: 16, type: \"mcq\", stem: \"حديث «من أحدث في أمرنا هذا ما ليس منه فهو رَدّ» رواه:\",\n    options: [\"عائشة رضي الله عنها\", \"أبو هريرة رضي الله عنه\", \"أنس بن مالك رضي الله عنه\", \"ابن مسعود رضي الله عنه\"] },\n  { id: 17, type: \"tf\", stem: \"حرمة دم المسلم وماله وعِرضه ثابتة بنصّ الحديث.\" },\n  { id: 18, type: \"short\", length: \"line\", stem: \"كم حديثاً زاد الحافظ ابن رجب رحمه الله على متن الأربعين؟\", hint: \"اكتب العدد.\" },\n  { id: 19, type: \"mcq\", stem: \"قوله ﷺ: «المسلمُ من سَلِمَ المسلمون من لسانه ويده» يدلّ على:\",\n    options: [\"أن كفّ الأذى من كمال الإسلام\", \"أن الإسلام قولٌ بلا عمل\", \"أن الأذى لا ينقص الإيمان\", \"أن الإسلام يختص بالجوارح دون القلب\"] },\n  { id: 20, type: \"tf\", stem: \"الصدقة تُطلق في الحديث على كل معروف، ومنه إماطة الأذى عن الطريق.\" },\n];\n\nconst PREFILLED = {\n  1: 0, 2: \"true\", 3: 1, 4: \"الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان.\",\n  5: 0, 6: \"true\", 8: 0, 9: \"true\", 10: 0,\n  11: \"أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك؛ وهي أعلى مراتب الدين الثلاث.\",\n  13: \"false\", 14: 0, 15: \"الإخلاص لله تعالى، والمتابعة لسنة النبي ﷺ.\",\n  16: 0, 17: \"true\", 19: 0, 20: \"true\",\n};\n\nfunction two(n) { return String(n).padStart(2, \"0\"); }\nfunction clock(sec) {\n  const s = Math.max(0, sec);\n  return two(Math.floor(s / 60)) + \":\" + two(s % 60);\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen: this.props.screen || \"in-progress\",\n    index: (Number(this.props.startQuestion) || 5) - 1,\n    answers: { ...PREFILLED },\n    flags: { 7: true, 14: true },\n    sheetOpen: !!this.props.sheetOpen,\n    remaining: (this.props.timerState === \"low\" ? 4 * 60 + 38 : 42 * 60 + 15),\n  };\n\n  componentDidMount() {\n    if (this.props.live === false) return;\n    this.tick = setInterval(() => {\n      const running = this.state.screen === \"in-progress\" && (this.props.timed !== false);\n      if (!running) return;\n      this.setState((s) => {\n        const next = Math.max(0, s.remaining - 1);\n        return next === 0 ? { remaining: 0, screen: \"time-up\", sheetOpen: false } : { remaining: next };\n      });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this.tick); }\n  componentDidUpdate(prev) {\n    if (prev.screen !== this.props.screen) this.setState({ screen: this.props.screen });\n    if (prev.startQuestion !== this.props.startQuestion) this.setState({ index: (Number(this.props.startQuestion) || 5) - 1 });\n    if (prev.sheetOpen !== this.props.sheetOpen) this.setState({ sheetOpen: !!this.props.sheetOpen });\n    if (prev.timerState !== this.props.timerState) {\n      this.setState({ remaining: this.props.timerState === \"low\" ? 4 * 60 + 38 : 42 * 60 + 15 });\n    }\n  }\n\n  isAnswered(q) {\n    const v = this.state.answers[q.id];\n    if (v === undefined || v === null) return false;\n    if (typeof v === \"string\") return v.trim().length > 0;\n    return true;\n  }\n\n  setAnswer(id, val) { this.setState((s) => ({ answers: { ...s.answers, [id]: val } })); }\n  jump(i) { this.setState({ index: i }); }\n  toggleFlag(id) { this.setState((s) => ({ flags: { ...s.flags, [id]: !s.flags[id] } })); }\n\n  navStyle(kind) {\n    const base = \"position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; min-height: 38px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; cursor: pointer; transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard); \";\n    if (kind === \"current\") return base + \"background: var(--surface-brand); border: 1px solid var(--surface-brand); color: var(--text-on-brand); box-shadow: 0 0 0 3px var(--ribaat-green-100);\";\n    if (kind === \"answered\") return base + \"background: var(--ribaat-green-100); border: 1px solid var(--ribaat-green-200); color: var(--text-brand);\";\n    return base + \"background: var(--surface-card); border: 1px solid var(--border-subtle); color: var(--text-secondary);\";\n  }\n\n  chipStyle(kind) {\n    const base = \"position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 40px; height: 32px; padding: 0 13px; border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; cursor: pointer; transition: background var(--duration-fast) var(--ease-standard); \";\n    if (kind === \"current\") return base + \"background: var(--surface-brand); border: 1px solid var(--surface-brand); color: var(--text-on-brand);\";\n    if (kind === \"answered\") return base + \"background: var(--ribaat-green-100); border: 1px solid var(--ribaat-green-200); color: var(--text-brand);\";\n    return base + \"background: var(--surface-card); border: 1px dashed var(--border-default); color: var(--text-muted);\";\n  }\n\n  rowStyle(kind) {\n    const base = \"display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); cursor: pointer; text-align: start; transition: background var(--duration-fast) var(--ease-standard); \";\n    if (kind === \"current\") return base + \"background: var(--ribaat-green-100); border-inline-start: 3px solid var(--surface-brand);\";\n    return base + \"background: transparent; border-inline-start: 3px solid transparent;\";\n  }\n\n  swatch(kind) {\n    const base = \"display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; \";\n    if (kind === \"current\") return base + \"background: var(--surface-brand); border: 1px solid var(--surface-brand);\";\n    if (kind === \"answered\") return base + \"background: var(--ribaat-green-100); border: 1px solid var(--ribaat-green-200);\";\n    if (kind === \"flagged\") return \"display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; background: var(--surface-card); border: 1px solid var(--border-subtle); box-shadow: inset 3px -3px 0 0 var(--surface-accent);\";\n    return base + \"background: var(--surface-card); border: 1px solid var(--border-default);\";\n  }\n\n  navButtonStyle(disabled, primary) {\n    const base = \"display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-base); font-we const trueFalseStyle = this.props.trueFalseStyle || \"compact\";\n    const legendPlacement = this.props.legendPlacement || \"outside\";\n    const q = QUESTIONS[this.state.index];\n    const answers = this.state.answers;\n    const answeredCount = QUESTIONS.filter((x) => this.isAnswered(x)).length;\n    const unanswered = QUESTIONS.filter((x) => !this.isAnswered(x));\n    const flaggedCount = QUESTIONS.filter((x) => this.state.flags[x.id]).length;\n\n    const typeShortNames = { mcq: \"اختيار من متعدد\", tf: \"صواب أو خطأ\", short: \"إجابة قصيرة\" };\n    const navCells = QUESTIONS.map((x, i) => {\n      const isCurrent = i === this.state.index;\n      const answered = this.isAnswered(x);\n      const kind = isCurrent ? \"current\" : answered ? \"answered\" : \"unanswered\";\n      return {\n        n: i + 1,\n        flagged: allowFlagging && !!this.state.flags[x.id],\n        answered: answered,\n        unanswered: !answered,\n        style: this.navStyle(kind),\n        chipStyle: this.chipStyle(kind),\n        rowStyle: this.rowStyle(kind),\n        typeLabel: typeShortNames[x.type],\n        jumpAndReturn: () => this.setState({ screen: \"in-progress\", index: i, sheetOpen: false }),\n        rowLabel: navigatorTypeLabels ? typeShortNames[x.type] : (answered ? \"تمت الإجابة\" : \"بدون إجابة\"),\n        numColor: isCurrent ? \"var(--text-brand)\" : answered ? \"var(--text-primary)\" : \"var(--text-muted)\",\n        labelColor: isCurrent ? \"var(--text-brand)\" : \"var(--text-secondary)\",\n        aria: \"السؤال \" + (i + 1),\n        jump: () => this.jump(i),\n        jumpAndClose: () => this.setState({ index: i, sheetOpen: false }),\n      };\n    });\n\n    const letters = [\"أ\", \"ب\", \"ج\", \"د\", \"هـ\", \"و\"];\n    const optionRow = (selected) =>\n      \"display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 16px; border-radius: var(--radius-md); text-align: start; cursor: pointer; transition: background var(--duration-fast)
