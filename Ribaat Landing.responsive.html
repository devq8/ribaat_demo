<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رباط الحنابلة — عرض الاستجابة</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #17150f; }
  body {
    font-family: "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    color: #e8e2d4;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-block-end: 1px solid #33301f;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .hint { font-size: 12px; color: #9a937f; }
  .strip {
    flex: 1; display: flex; gap: 32px; align-items: flex-start;
    padding: 28px 24px 40px; overflow: auto;
  }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; flex: none; }
  figcaption { font-size: 11px; letter-spacing: .08em; color: #9a937f; direction: ltr; font-family: ui-monospace, monospace; }
  .device {
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<header>
  <h1>صفحة الهبوط — عرض على ثلاثة عروض</h1>
  <span class="hint">كل إطار صفحةٌ حيّة، قابلة للتمرير والنقر بشكل مستقل.</span>
</header>
<div class="strip">
  <figure>
    <div class="device"><iframe src="Ribaat Landing.preview.html" width="390" height="844" title="390"></iframe></div>
    <figcaption>390 × 844 — iPhone</figcaption>
  </figure>
  <figure>
    <div class="device"><iframe src="Ribaat Landing.preview.html" width="834" height="1112" title="834"></iframe></div>
    <figcaption>834 × 1112 — iPad</figcaption>
  </figure>
  <figure>
    <div class="device"><iframe src="Ribaat Landing.preview.html" width="1280" height="800" title="1280"></iframe></div>
    <figcaption>1280 × 800 — laptop</figcaption>
  </figure>
</div>
</body>
</html>
