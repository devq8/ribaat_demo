<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="ext-resource-dependency" content="../../assets/logos/ribaat-lockup-2026.png" data-resource-id="footer-lockup" />
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/fonts.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/colors.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/colors-dark.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/typography.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/spacing.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/effects.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--text-link); text-decoration: none; }
    a:hover { color: var(--text-link-hover); }
  </style>
</helmet>

<footer dir="rtl" style="background: var(--surface-card); border-top: 1px solid var(--border-subtle); font-family: var(--font-sans);">
  <div style="max-width: {{ containerMaxWidth }}; margin: 0 auto; padding: 32px clamp(24px, 6vw, 120px); display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; flex-wrap: wrap;">
    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 320px;">
      <img src="../../assets/logos/ribaat-lockup-2026.png" alt="رباط الحنابلة" style="height: 65px; align-self: flex-start; filter: {{ logoFilter }}; width: 110px">
      <p style="margin: 0; font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-relaxed);">مدرسة شرعية تأصيلية — دورات ودروس في العقيدة والفقه والحديث والسيرة، بإجازات بالسند المتصل.</p>
    </div>
    <div style="display: flex; gap: 56px; flex-wrap: wrap;">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);">روابط</span>
        <a href="StudentDashboard.dc.html" style="font-size: var(--text-sm); color: var(--text-secondary);">لوحة التحكم</a>
        <a href="CourseCatalogue.dc.html" style="font-size: var(--text-sm); color: var(--text-secondary);">الدورات</a>
        <a href="StudentPaths.dc.html" style="font-size: var(--text-sm); color: var(--text-secondary);">البرامج الدراسية</a>
        <a href="StudentCertificates.dc.html" style="font-size: var(--text-sm); color: var(--text-secondary);">الشهادات</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);">الدعم والتعريف</span>
        <a href="#" style="font-size: var(--text-sm); color: var(--text-secondary);">عن المدرسة</a>
        <a href="#" style="font-size: var(--text-sm); color: var(--text-secondary);">الأسئلة الشائعة</a>
        <a href="#" style="font-size: var(--text-sm); color: var(--text-secondary);">الدعم الفني</a>
        <a href="#" style="font-size: var(--text-sm); color: var(--text-secondary);">تواصل معنا</a>
      </div>
    </div>
  </div>
  <div style="border-top: 1px solid var(--border-subtle);">
    <div style="max-width: {{ containerMaxWidth }}; margin: 0 auto; padding: 14px clamp(24px, 6vw, 120px);">
      <p style="margin: 0; font-size: var(--text-xs); color: var(--text-muted);">© 1448هـ — رباط الحنابلة. جميع الحقوق محفوظة.</p>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 260},
  &quot;containerMaxWidth&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1200px&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;logoFilter&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;none&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      containerMaxWidth: this.props.containerMaxWidth || "1200px",
      logoFilter: this.props.logoFilter || "none"
    };
  }
}
</script>
</body>
</html>
