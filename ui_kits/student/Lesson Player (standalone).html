document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"59355ec7-b81b-4ac3-b30f-884afa1b2f44\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* Ribaat Design System — Webfonts\n   Substitutions (no brand font files were provided):\n   - \"Amiri\" stands in for a classical Naskh display/heading face — used for\n     headings, honorifics, and Qur'an/Hadith citation blocks.\n   - \"IBM Plex Sans Arabic\" stands in for the UI/body face — used for all\n     interface text, forms, and navigation.\n   Flagged in readme.md — ask the brand team for real webfonts if they exist. */\n\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4fff3de1-897d-4a02-8d8f-5a1f6eba2c30\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3af4912d-e606-473c-b195-573970dfde5f\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"85c18db3-a9c7-472b-9e07-8836acae55d0\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"Amiri\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4cc6ae13-e4b3-411d-8026-e1f2476d43c8\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1f455368-2f13-465f-9482-deaab11d0677\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7e8a2902-b1f1-4d14-8ba5-1170241d8b7c\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7788472a-1ea5-43be-afa9-b0ee57662ae0\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d14c173e-0505-420c-ad87-835164004741\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3fdf1bbe-f285-4d68-8070-90745e89835a\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0ed84cb9-73f1-48c1-9944-1612a4c61d49\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b2255eb0-ee71-4a9f-bdd6-1273d9709bd8\") format(\"woff2\");\n  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Arabic\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c5f1bd4f-b559-4d38-a91c-455abd03cbc5\") format(\"woff2\");\n  unicode-range: U+0000-00FF, U+2000-206F;\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Color tokens\n   Base palette extracted from the brand mark (uploads/Artboard 46.pdf):\n     olive green  rgb(96,114,71)  = #607247\n     brown/tan    rgb(140,95,53) = #8C5F35\n   Neutrals and semantic colors are derived in oklch to stay harmonious\n   with that pair — a warm, paper-like, academic register (no cool grays). */\n:root {\n  /* ---- Base: brand ---- */\n  --ribaat-green-900: #2E3A24;\n  --ribaat-green-800: #3E4E32;\n  --ribaat-green-700: #4F6140;\n  --ribaat-green-600: #607247; /* brand primary — exact PDF value */\n  --ribaat-green-500: #728759;\n  --ribaat-green-400: #8FA079;\n  --ribaat-green-300: #B2C0A2;\n  --ribaat-green-200: #D4DCC9;\n  --ribaat-green-100: #EBEFE4;\n  --ribaat-green-50:  #F5F7F0;\n\n  --ribaat-brown-900: #4A3A22;\n  --ribaat-brown-800: #63492A;\n  --ribaat-brown-700: #79552F;\n  --ribaat-brown-600: #8C5F35; /* brand accent — exact PDF value */\n  --ribaat-brown-500: #A47846;\n  --ribaat-brown-400: #BB9868;\n  --ribaat-brown-300: #D3BC98;\n  --ribaat-brown-200: #E7DBC4;\n  --ribaat-brown-100: #F3EBDD;\n\n  /* ---- Base: neutrals (warm parchment, not cool gray) ---- */\n  --ribaat-ink-900: #211F19;\n  --ribaat-ink-800: #333026;\n  --ribaat-ink-700: #494434;\n  --ribaat-ink-600: #635C48;\n  --ribaat-ink-500: #82795F;\n  --ribaat-ink-400: #A69C81;\n  --ribaat-ink-300: #C9BFA6;\n  --ribaat-ink-200: #E2DAC5;\n  --ribaat-ink-100: #EFEADB;\n  --ribaat-paper-050: #FBF9F3;\n  --ribaat-paper-000: #FFFEFA;\n\n  /* ---- Base: semantic hues (muted, never neon) ---- */\n  --ribaat-red-600: #A6473B;\n  --ribaat-red-100: #F4E3DF;\n  --ribaat-amber-600: #A97A24;\n  --ribaat-amber-100: #F3E7CC;\n  --ribaat-blue-600: #3E6B7A;\n  --ribaat-blue-100: #DEE9EB;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--ribaat-paper-050);\n  --surface-card: var(--ribaat-paper-000);\n  --surface-sunken: var(--ribaat-ink-100);\n  --surface-brand: var(--ribaat-green-600);\n  --surface-brand-strong: var(--ribaat-green-800);\n  --surface-accent: var(--ribaat-brown-600);\n  --surface-overlay: rgba(33, 31, 25, 0.55);\n\n  --border-subtle: var(--ribaat-ink-200);\n  --border-default: var(--ribaat-ink-300);\n  --border-strong: var(--ribaat-ink-500);\n  --border-brand: var(--ribaat-green-500);\n\n  --text-primary: var(--ribaat-ink-900);\n  --text-secondary: var(--ribaat-ink-600);\n  --text-muted: var(--ribaat-ink-500);\n  --text-on-brand: var(--ribaat-paper-000);\n  --text-on-accent: var(--ribaat-paper-000);\n  --text-brand: var(--ribaat-green-700);\n  --text-accent: var(--ribaat-brown-700);\n  --text-link: var(--ribaat-green-700);\n  --text-link-hover: var(--ribaat-green-800);\n\n  --state-success-fg: #3E6B4A;\n  --state-success-bg: var(--ribaat-green-100);\n  --state-warning-fg: var(--ribaat-amber-600);\n  --state-warning-bg: var(--ribaat-amber-100);\n  --state-danger-fg: var(--ribaat-red-600);\n  --state-danger-bg: var(--ribaat-red-100);\n  --state-info-fg: var(--ribaat-blue-600);\n  --state-info-bg: var(--ribaat-blue-100);\n\n  --focus-ring: var(--ribaat-green-500);\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Dark theme layer (ADDITION, proposed for upstream merge)\n   ------------------------------------------------------------------------\n   Built while designing ui_kits/student/StudentDashboard.dc.html. Not part\n   of the original system pass — flagged here so it can be folded into the\n   canonical token set once reviewed.\n\n   Approach: a single [data-theme=\"dark\"] attribute scope that overrides the\n   semantic aliases AND the specific base-ramp steps components consume\n   directly (badges/buttons reach into --ribaat-green-100/600/700 etc, not\n   just the aliases). Apply by setting data-theme=\"dark\" on any ancestor\n   element (typically the page root); everything under it repaints via the\n   existing var() references in colors.css — no component changes needed.\n\n   Direction: warm, muted dark — kept in the same olive/brown family as\n   light mode, never a cold near-black SaaS dark and never pure black.\n   Semantic (success/warning/danger/info) colors are desaturated the same\n   way the light versions are; nothing here uses saturated/neon hues. */\n\n[data-theme=\"dark\"] {\n  /* ---- Surfaces ---- */\n  --surface-page: #201E18;\n  --surface-card: #2B2820;\n  --surface-sunken: #1B1913;\n  --surface-brand: #6B8151;\n  --surface-brand-strong: #55663F;\n  --surface-accent: #96703F;\n  --surface-overlay: rgba(10, 9, 7, 0.6);\n\n  /* ---- Borders ---- */\n  --border-subtle: #3A362C;\n  --border-default: #4A4536;\n  --border-strong: #6B6551;\n  --border-brand: #7C9161;\n\n  /* ---- Text ---- */\n  --text-primary: #EDE6D6;\n  --text-secondary: #C4B99F;\n  --text-muted: #93876C;\n  --text-on-brand: #F7F3E7;\n  --text-on-accent: #F7F3E7;\n  --text-brand: #A9BE8F;\n  --text-accent: #D3B583;\n  --text-link: #A9BE8F;\n  --text-link-hover: #C3D6AC;\n\n  --focus-ring: #94A87A;\n\n  /* ---- Base ramp steps consumed directly by components ----\n     (Badge/Button/CourseCard/Avatar reach into these, not only the\n     aliases above — both layers must repaint together.) */\n  --ribaat-green-100: #33402A;\n  --ribaat-green-200: #3D4A31;\n  --ribaat-green-600: #7C9161;\n  --ribaat-green-700: #94A87A; /* lighter than 600 on purpose: dark-mode hover\n                                   should brighten, not darken toward bg */\n  --ribaat-green-800: #55663F;\n\n  --ribaat-brown-100: #3D3020;\n  --ribaat-brown-200: #493924;\n  --ribaat-brown-600: #96703F;\n  --ribaat-brown-700: #C9A876;\n\n  --ribaat-amber-100: #3A2F1C;\n  --ribaat-amber-600: #D3A85C;\n  --ribaat-red-100: #3C2420;\n  --ribaat-red-600: #D98A7C;\n  --ribaat-blue-100: #1F323A;\n  --ribaat-blue-600: #7FB6C7;\n\n  /* ---- Semantic state colors — muted/desaturated, same spirit as light ---- */\n  --state-success-bg: #2B3B27;\n  --state-success-fg: #8FBB85;\n  --state-warning-bg: #3A2F1C;\n  --state-warning-fg: #D3A85C;\n  --state-danger-bg: #3C2420;\n  --state-danger-fg: #D98A7C;\n  --state-info-bg: #1F323A;\n  --state-info-fg: #7FB6C7;\n}\n<\u002Fstyle>\n  <style>/* Ribaat Design System — Type tokens\n   RTL-first, Arabic-only v1. \"display\" = Amiri (Naskh serif, academic/\n   classical feel — headings, honorifics, Qur'an/Hadith citations).\n   \"sans\" = IBM Plex Sans Arabic (UI, body copy, forms, navigation). */\n:root {\n  --font-display: \"Amiri\", \"Times New Roman\", serif;\n  --font-sans: \"IBM Plex Sans Arabic\", \"Segoe UI\", Tahoma, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, monospace; /* certificate/course codes only — @font-face pending; brand should upload real font files */\n\n  /* Type scale — 1.25 ratio, base 16px */\n  --text-xs: 0.75rem;    /* 12px — meta, timestamps */\n  --text-sm: 0.875rem;   /* 14px — captions, form hints */\n  --text-base: 1rem;     /* 16px — body */\n  --text-md: 1.125rem;   /* 18px — lead paragraph */\n  --text-lg: 1.375rem;   /* 22px — card titles */\n  --text-xl: 1.75rem;    /* 28px — section headings */\n  --text-2xl: 2.25rem;   /* 36px — page titles */\n  --text-3xl: 3rem;      /* 48px — hero */\n\n  --leading-tight: 1.25;\n  --leading-normal: 1.55;  /* Arabic needs more line-height than Latin */\n  --leading-relaxed: 1.9;  /* Qur'an/Hadith citation blocks */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  --tracking-normal: 0; /* never use letter-spacing on Arabic script */\n}\n<\u002Fstyle>\n  <style>:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  --container-max: 1200px;\n  --container-padding: var(--space-6);\n}\n<\u002Fstyle>\n  <style>:root {\n  /* Corners — soft, calm, not overly rounded */\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n\n  /* Shadows — low elevation, warm-tinted (never pure black) */\n  --shadow-sm: 0 1px 2px rgba(33, 31, 25, 0.06);\n  --shadow-md: 0 4px 14px rgba(33, 31, 25, 0.08);\n  --shadow-lg: 0 12px 32px rgba(33, 31, 25, 0.12);\n\n  /* Motion — restrained, no bounce */\n  --ease-standard: cubic-bezier(0.2, 0, 0, r(--ribaat-ink-600);\n  --text-muted: var(--ribaat-ink-500);\n  --text-on-brand: var(--ribaat-paper-000);\n  --text-on-accent: var(--ribaat-paper-000);\n  --text-brand: var(--ribaat-green-700);\n  --text-accent: var(--ribaat-brown-700);\n  --text-link: var(--ribaat-green-700);\n  --text-link-hover: var(--ribaat-green-800);\n\n  --state-success-fg: #3E6B4A;\n  --state-success-bg: var(--ribaat-green-100);\n  --state-warning-fg: var(--ribaat-amber-600);\n  --state-warning-bg: var(--ribaat-amber-100);\n  --state-danger-fg: var(--ribaat-red-600);\n  --state-danger-bg: var(--ribaat-red-100);\n  --state-info-fg: var(--ribaat-blue-600);\n  --state-info-bg: var(--ribaat-blue-100);\n\n  --focus-ring: var(--ribaat-green-500);\n}\n\n/* Ribaat Design System — Type tokens\n   RTL-first, Arabic-only v1. \"display\" = Amiri (Naskh serif, academic/\n   classical feel — headings, honorifics, Qur'an/Hadith citations).\n   \"sans\" = IBM Plex Sans Arabic (UI, body copy, forms, navigation). */\n:root {\n  --font-display: \"Amiri\", \"Times New Roman\", serif;\n  --font-sans: \"IBM Plex Sans Arabic\", \"Segoe UI\", Tahoma, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, monospace; /* certificate/course codes only — @font-face pending; brand should upload real font files */\n\n  /* Type scale — 1.25 ratio, base 16px */\n  --text-xs: 0.75rem;    /* 12px — meta, timestamps */\n  --text-sm: 0.875rem;   /* 14px — captions, form hints */\n  --text-base: 1rem;     /* 16px — body */\n  --text-md: 1.125rem;   /* 18px — lead paragraph */\n  --text-lg: 1.375rem;   /* 22px — card titles */\n  --text-xl: 1.75rem;    /* 28px — section headings */\n  --text-2xl: 2.25rem;   /* 36px — page titles */\n  --text-3xl: 3rem;      /* 48px — hero */\n\n  --leading-tight: 1.25;\n  --leading-normal: 1.55;  /* Arabic needs more line-height than Latin */\n  --leading-relaxed: 1.9;  /* Qur'an/Hadith citation blocks */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  --tracking-normal: 0; /* never use letter-spacing on Arabic script */\n}\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  --container-max: 1200px;\n  --container-padding: var(--space-6);\n}\n\n:root {\n  /* Corners — soft, calm, not overly rounded */\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n\n  /* Shadows — low elevation, warm-tinted (never pure black) */\n  --shadow-sm: 0 1px 2px rgba(33, 31, 25, 0.06);\n  --shadow-md: 0 4px 14px rgba(33, 31, 25, 0.08);\n  --shadow-lg: 0 12px 32px rgba(33, 31, 25, 0.12);\n\n  /* Motion — restrained, no bounce */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-normal: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  --border-width: 1px;\n}\n\n<\u002Fstyle>\n  <script src=\"776baab2-9db0-4fe6-995a-e0ce50bcdba0\"><\u002Fscript>\n  <script src=\"3e93ce16-98b3-4b8c-beef-7c070cb435ae\"><\u002Fscript>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; }\n    a { color: var(--text-link); text-decoration: none; }\n    a:hover { color: var(--text-link-hover); }\n    textarea { font-family: var(--font-sans); }\n    button, input, select, textarea { font-family: inherit; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" data-theme=\"{{ themeAttr }}\" style=\"background: var(--surface-page); min-height: 100vh; font-family: var(--font-sans); transition: background var(--duration-normal) var(--ease-standard);\" data-screen-label=\"Lesson Player — {{ frameLabel }}\">\n\n  <header style=\"display: flex; align-items: center; justify-content: space-between; padding: 14px clamp(24px, 6vw, 120px); background: var(--surface-card); border-bottom: 1px solid var(--border-subtle);\">\n    <div style=\"display: flex; align-items: center; gap: 36px;\">\n      <img src=\"5bf82ca8-ff2b-4d5f-a470-92bfe973220b\" alt=\"رباط الحنابلة\" style=\"height: 30px; filter: {{ logoFilter }};\">\n      <nav style=\"display: flex; gap: 26px;\">\n        <a href=\"StudentDashboard.dc.html\" style=\"font-size: var(--text-base); color: var(--text-secondary);\">لوحة التحكم<\u002Fa>\n        <a href=\"CourseCatalogue.dc.html\" style=\"font-size: var(--text-base); color: var(--text-secondary);\">اكتشف الدورات<\u002Fa>\n        <a href=\"LearningPaths.dc.html\" style=\"font-size: var(--text-base); color: var(--text-secondary);\">المسارات<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"position: relative;\">\n      <button sc-camel-on-click=\"{{ toggleAccountMenu }}\" aria-label=\"الحساب\" style=\"background: none; border: none; padding: 0; cursor: pointer; border-radius: 50%; display: flex;\">\n        <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.Avatar\" name=\"{{ studentName }}\" size=\"sm\" hint-size=\"32px,32px\"><\u002Fx-import>\n      <\u002Fbutton>\n      <sc-if value=\"{{ accountMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; top: calc(100% + 10px); inset-inline-end: 0; min-width: 200px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; z-index: 30;\">\n          <div style=\"padding: 8px 12px;\">\n            <p style=\"margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ studentName }}<\u002Fp>\n            <p style=\"margin: 2px 0 0; font-size: var(--text-xs); color: var(--text-muted);\">طالب<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height: 1px; background: var(--border-subtle); margin: 4px 6px;\"><\u002Fdiv>\n          <button style-hover=\"background: var(--surface-sunken);\" style=\"display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px; background: none; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; text-align: start;\">\n            <i data-lucide=\"presentation\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n            <span>لوحة المعلم<\u002Fspan>\n          <\u002Fbutton>\n          <button style-hover=\"background: var(--surface-sunken);\" style=\"display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px; background: none; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; text-align: start;\">\n            <i data-lucide=\"shield\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n            <span>لوحة الإدارة<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"height: 1px; background: var(--border-subtle); margin: 4px 6px;\"><\u002Fdiv>\n          <button style-hover=\"background: var(--surface-sunken);\" style=\"display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px; background: none; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; text-align: start;\">\n            <i data-lucide=\"settings\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n            <span>الإعدادات<\u002Fspan>\n          <\u002Fbutton>\n          <button style-hover=\"background: var(--surface-sunken);\" style=\"display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px; background: none; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; text-align: start;\">\n            <i data-lucide=\"mail\" style= th: 16px; height: 16px; color: var(--text-muted); flex: none;\"><\u002Fi>\n                    <span style=\"width: 16px; height: 16px; border-radius: 50%; border: 1px solid {{ day.checkBorder }}; background: {{ day.checkBg }}; display: flex; align-items: center; justify-content: center; flex: none;\">\n                      <sc-if value=\"{{ day.allDone }}\" hint-placeholder-val=\"{{ false }}\">\n                        <i data-lucide=\"check\" style=\"width: 10px; height: 10px; color: var(--text-on-brand);\"><\u002Fi>\n                      <\u002Fsc-if>\n                    <\u002Fspan>\n                    <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ day.label }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size: var(--text-xs); color: var(--text-muted); flex: none; white-space: nowrap;\">{{ day.summaryLine }}<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ day.open }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"padding-bottom: 6px;\">\n                    <sc-for list=\"{{ day.lectures }}\" as=\"lec\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ lec.select }}\" disabled=\"{{ lec.locked }}\" style=\"width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: {{ lec.rowBg }}; border: none; border-inline-start: {{ lec.rowBorder }}; cursor: {{ lec.cursor }}; text-align: start; font-family: var(--font-sans);\">\n                        <sc-if value=\"{{ lec.locked }}\" hint-placeholder-val=\"{{ false }}\">\n                          <i data-lucide=\"lock\" style=\"width: 15px; height: 15px; color: var(--text-muted); flex: none;\"><\u002Fi>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ lec.showCheckbox }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span sc-camel-on-click=\"{{ lec.toggleDone }}\" style=\"width: 17px; height: 17px; border-radius: var(--radius-sm); border: 1px solid {{ lec.checkBorder }}; background: {{ lec.checkBg }}; display: flex; align-items: center; justify-content: center; flex: none;\">\n                            <sc-if value=\"{{ lec.done }}\" hint-placeholder-val=\"{{ false }}\">\n                              <i data-lucide=\"check\" style=\"width: 11px; height: 11px; color: var(--text-on-brand);\"><\u002Fi>\n                            <\u002Fsc-if>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1; min-width: 0; font-size: var(--text-sm); color: {{ lec.titleColor }}; font-weight: {{ lec.titleWeight }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ lec.title }}<\u002Fspan>\n                        <span style=\"font-size: var(--text-xs); color: var(--text-muted); flex: none;\">{{ lec.durationLabel }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border-subtle);\">\n            <button sc-camel-on-click=\"{{ goPrev }}\" disabled=\"{{ !hasPrev }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: {{ prevCursor }}; opacity: {{ prevOpacity }}; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-default);\">\n              <i data-lucide=\"chevron-right\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n              الدرس السابق\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ !hasNext }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: {{ nextCursor }}; opacity: {{ nextOpacity }}; background: var(--surface-brand); color: var(--text-on-brand); border: 1px solid var(--surface-brand);\">\n              {{ nextLabel }}\n              <i data-lucide=\"chevron-left\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Lecture meta + tabs + tab content -->\n      <div style=\"display: flex; flex-direction: column; gap: {{ sectionGap }};\">\n\n        <div>\n          <p style=\"margin: 0 0 6px; font-size: var(--text-sm); color: var(--text-muted);\">\n            <a href=\"#\" style=\"color: var(--text-link);\">{{ courseTitle }}<\u002Fa>\n          <\u002Fp>\n          <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n            <h1 style=\"margin: 0; font-family: var(--font-display); font-size: {{ h1Size }}; color: var(--text-primary); font-weight: var(--weight-bold);\">{{ currentLecture.title }}<\u002Fh1>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 18px; margin-top: 10px; flex-wrap: wrap;\">\n            <span style=\"display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--text-secondary);\">\n              <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.Avatar\" name=\"{{ instructorName }}\" size=\"sm\" hint-size=\"28px,28px\"><\u002Fx-import>\n              د. {{ instructorName }}\n            <\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-muted);\">\n              <i data-lucide=\"clock\" style=\"width: 15px; height: 15px;\"><\u002Fi>\n              {{ currentLecture.durationLabel }}\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.Tabs\" tabs=\"{{ tabItems }}\" active=\"{{ activeTab }}\" on-change=\"{{ setActiveTab }}\" hint-size=\"100%,44px\"><\u002Fx-import>\n\n          <div style=\"margin-top: 22px;\">\n\n            <!-- Overview -->\n            <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px;\">\n                <p style=\"margin: 0; font-size: var(--text-base); color: var(--text-primary); line-height: var(--leading-relaxed);\">{{ currentLecture.description }}<\u002Fp>\n                <sc-if value=\"{{ currentLecture.hasHadith }}\" hint-placeholder-val=\"{{ false }}\">\n                  <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.HadithCitation\" text=\"{{ currentLecture.hadithText }}\" source=\"{{ currentLecture.hadithSource }}\" hint-size=\"auto,auto\"><\u002Fx-import>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Q&A -->\n            <sc-if value=\"{{ isQa }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 18px; max-width: 720px;\">\n                <sc-if value=\"{{ hasQuestions }}\" hint-placeholder-val=\"{{ true }}\">\n                  <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"2\">\n                    <div style=\"border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px;\">\n                      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;\">\n                        <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ q.asker }}<\u002Fspan>\n                        <span style=\"font-size: var(--text-xs); color: var(--text-muted);\">{{ q.timestamp }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <p style=\"margin: 0 0 10px; font-size: var(--text-base); color: var(--text-primary);\">{{ q.text }}<\u002Fp>\n                      <sc-if value=\"{{ q.hasAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display: flex; gap: 10px; background: var(--surface-sunken); border-radius: var(--radius-md); padding: 12px 14px;\">\n                          <div style=\"flex: 1; min-width: 0;\">\n                            <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 4px;\">\n                              <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ q.answer.name }}<\u002Fspan>\n                              <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.Badge\" tone=\"brand\" hint-size=\"auto,18px\">مُعلّم<\u002Fx-import>\n                            <\u002Fdiv>\n                            <p style=\"margin: 0; font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--leading-normal);\">{{ q.answer.text }}<\u002Fp>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ hasNoQuestions }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"text-align: center; padding: 32px 0; color: var(--text-muted);\">\n                    <p style=\"margin: 0; font-size: var(--text-base);\">لا توجد أسئلة على هذا الدرس بعد — كن أول من يسأل.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 4px;\">\n                  <label style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">اطرح سؤالاً على هذا الدرس<\u002Flabel>\n                  <textarea placeholder=\"اكتب سؤالك هنا…\" style=\"min-height: 84px; resize: vertical; border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 12px 14px; font-size: var(--text-base); color: var(--text-primary); background: var(--surface-card);\"><\u002Ftextarea>\n                  <div>\n                    <x-import component-from-global-scope=\"RibaatDesignSystem_790e93.Button\" variant=\"primary\" hint-size=\"auto,42px\">إرسال السؤال<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Documents -->\n            <sc-if value=\"{{ isDocuments }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; max-width: 720px;\">\n                <sc-for list=\"{{ documents }}\" as=\"doc\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--border-subtle);\">\n                    <i data-lucide=\"{{ doc.icon }}\" style=\"width: 19px; height: 19px; color: var(--text-muted); flex: none;\"><\u002Fi>\n                    <span style=\"flex: 1; min-width: 0; font-size: var(--text-base); color: var(--text-primary);\">{{ doc.name }}<\u002Fspan>\n                    <span style=\"font-size: var(--text-xs); color: var(--text-muted); flex: none;\">{{ doc.size }}<\u002Fspan>\n                    <button aria-label=\"تنزيل\" style=\"background: none; border: none; color: var(--text-brand); cursor: pointer; display: flex; align-items: center; flex: none; padding: 4px;\">\n                      <i data-lucide=\"download\" style=\"width: 18px; height: 18px;\"><\u002Fi>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- Curriculum / course content — normal position (beside video, or below on mobile) -->\n      <sc-if value=\"{{ showSideSidebar }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex: {{ sidebarFlex }}; min-width: {{ sidebarMinWidth }}; max-width: {{ sidebarMaxWidth }}; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; {{ sidebarStickyStyle }}\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border-subtle);\">\n            <div>\n              <p style=\"margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--text-primary); font-family: var(--font-display);\">محتوى الدورة<\u002Fp>\n              <p style=\"margin: 4px 0 0; font-size: var(--text-xs); color: var(--text-muted);\">{{ courseProgressLine }}<\u002Fp>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showPanelClose }}\" hint-placeholder-val=\"{{ false }}\">\n              <button aria-label=\"إخفاء\" sc-camel-on-click=\"{{ toggleSidebar }}\" style=\"background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; padding: 4px;\">\n                <i data-lucide=\"x\" style=\"width: 18px; height: 18px;\"><\u002Fi>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"max-height: {{ sidebarMaxHeight }}; overflow-y: {{ sidebarOverflow }};\">\n            <sc-for list=\"{{ days }}\" as=\"day\" hint-placeholder-count=\"3\">\n              <div style=\"border-bottom: 1px solid var(--border-subtle);\">\n                <button sc-camel-on-click=\"{{ day.toggleOpen }}\" style=\"width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: none; border: none; cursor: pointer; text-align: start; font-family: var(--font-sans);\">\n                  <span style=\"display: flex; align-items: center; gap: 8px; min-width: 0;\">\n                    <i data-lucide=\"{{ day.chevronIcon }}\" style=\"width: 16px; height: 16px; color: var(--text-muted); flex: none;\"><\u002Fi>\n                    <span style=\"width: 16px; height: 16px; border-radius: 50%; border: 1px solid {{ day.checkBorder }}; background: {{ day.checkBg }}; display: flex; align-items: center; justify-content: center; flex: none;\">\n                      <sc-if value=\"{{ day.allDone }}\" hint-placeholder-val=\"{{ false }}\">\n                        <i data-lucide=\"check\" style=\"width: 10px; height: 10px; color: var(--text-on-brand);\"><\u002Fi>\n                      <\u002Fsc-if>\n                    <\u002Fspan>\n                    <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ day.label }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size: var(--text-xs); color: var(--text-muted); flex: none; white-space: nowrap;\">{{ day.summaryLine }}<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ day.open }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"padding-bottom: 6px;\">\n                    <sc-for list=\"{{ day.lectures }}\" as=\"lec\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ lec.select }}\" disabled=\"{{ lec.locked }}\" style=\"width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: {{ lec.rowBg }}; border: none; border-inline-start: {{ lec.rowBorder }}; cursor: {{ lec.cursor }}; text-align: start; font-family: var(--font-sans);\">\n                        <sc-if value=\"{{ lec.locked }}\" hint-placeholder-val=\"{{ false }}\">\n                          <i data-lucide=\"lock\" style=\"width: 15px; height: 15px; color: var(--text-muted); flex: none;\"><\u002Fi>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ lec.showCheckbox }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span sc-camel-on-click=\"{{ lec.toggleDone }}\" style=\"width: 17px; height: 17px; border-radius: var(--radius-sm); border: 1px solid {{ lec.checkBorder }}; background: {{ lec.checkBg }}; display: flex; align-items: center; justify-content: center; flex: none;\">\n                            <sc-if value=\"{{ lec.done }}\" hint-placeholder-val=\"{{ false }}\">\n                              <i data-lucide=\"check\" style=\"width: 11px; height: 11px; color: var(--text-on-brand);\"><\u002Fi>\n                            <\u002Fsc-if>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1; min-width: 0; font-size: var(--text-sm); color: {{ lec.titleColor }}; font-weight: {{ lec.titleWeight }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ lec.title }}<\u002Fspan>\n                        <span style=\"font-size: var(--text-xs); color: var(--text-muted); flex: none;\">{{ lec.durationLabel }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border-subtle);\">\n            <button sc-camel-on-click=\"{{ goPrev }}\" disabled=\"{{ !hasPrev }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: {{ prevCursor }}; opacity: {{ prevOpacity }}; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-default);\">\n              <i data-lucide=\"chevron-right\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n              الدرس السابق\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ !hasNext }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: {{ nextCursor }}; opacity: {{ nextOpacity }}; background: var(--surface-brand); color: var(--text-on-brand); border: 1px solid var(--surface-brand);\">\n              {{ nextLabel }}\n              <i data-lucide=\"chevron-left\" style=\"width: 16px; height: 16px;\"><\u002Fi>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n  <\u002Fmain>\n\n  <footer style=\"background: var(--surface-card); border-top: 1px solid var(--border-subtle); margin-top: 24px;\">\n    <div style=\"max-width: {{ containerMaxWidth }}; margin: 0 auto; padding: 32px clamp(24px, 6vw, 120px); display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; flex-wrap: wrap;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 320px;\">\n        <img src=\"5bf82ca8-ff2b-4d5f-a470-92bfe973220b\" alt=\"رباط الحنابلة\" style=\"height: 26px; align-self: flex-start; filter: {{ logoFilter }};\">\n        <p style=\"margin: 0; font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-relaxed);\">مدرسة شرعية تأصيلية — دورات ودروس في العقيدة والفقه والحديث والسيرة، بإجازات بالسند المتصل.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 56px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">روابط<\u002Fspan>\n          <a href=\"StudentDashboard.dc.html\" style=\"font-size: var(--text-sm); color: var(--text-secondary);\">لوحة التحكم<\u002Fa>\n          <a href=\"CourseCatalogue.dc.html\" style=\"font-size: var(--text-sm); color: var(--text-secondary);\">اكتشف الدورات<\u002Fa>\n          <a href=\"LearningPaths.dc.html\" style=\"font-size: var(--text-sm); color: var(--text-secondary);\">المسارات<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <span style=\"font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary);\">الشهادات<\u002Fspan>\n          <a href=\"#\" style=\"font-size: var(--text-sm); color: var(--text-secondary);\">الاستعلام عن شهادة<\u002Fa>\n          <a href=\"#\" style=\"font-size: var(--text-sm); color: var(--text-secondary);\">تواصل معنا<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 1px solid var(--border-subtle);\">\n      <div style=\"max-width: {{ containerMaxWidth }}; margin: 0 auto; padding: 14px clamp(24px, 6vw, 120px);\">\n        <p style=\"margin: 0; font-size: var(--text-xs); color: var(--text-muted);\">© 1448هـ — رباط الحنابلة. جميع الحقوق محفوظة.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 1000},\n  &quot;colorScheme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;viewport&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;desktop&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;desktop&quot;, &quot;tablet&quot;, &quot;mobile&quot;], &quot;section&quot;: &quot;Breakpoint&quot;}\n}\">\nconst RAW_DAYS = [\n  {\n    id: \"day1\",\n    label: \"اليوم الأول\",\n    lectures: [\n      { id: \"l1\", title: \"الحديث الأول: إنما الأعمال بالنيات\", duration: \"00:24:00\", state: \"completed\" },\n      { id: \"l2\", title: \"الحديث الثاني: حديث جبريل في الإسلام والإيمان والإحسان\", duration: \"00:41:00\", state: \"completed\" },\n      { id: \"l3\", title: \"الحديث الثالث: بُنِيَ الإسلام على خمس\", duration: \"00:33:00\", state: \"available\",\n        description: \"شرح لحديث ابن عمر رضي الله عنه في أركان الإسلام الخمسة، وبيان منزلتها من الدين وترتيب العمل بها.\",\n        hasHadith: true,\n        hadithText: \"بُنِيَ الإسلامُ على خمسٍ: شهادةِ أن لا إله إلا الله وأنَّ محمدًا رسولُ الله، وإقامِ الصلاةِ، وإيتاءِ الزكاةِ، والحجِّ، وصومِ رمضان\",\n        hadithSource: \"رواه البخاري ومسلم\" },\n      { id: \"l4\", title: \"الحديث الرابع: القدر وكتابة العبد قبل خلقه\", duration: \"00:27:00\", state: \"available\" },\n    ],\n  },\n  {\n    id: \"day2\",\n    label: \"اليوم الثاني\",\n    lectures: [\n      { id: \"l5\", title: \"الحديث الخامس: النهي عن المحدثات في الدين\", duration: \"00:29:00\", state: \"available\" },\n      { id: \"l6\", title: \"الحديث السادس: الحلال بيّن والحرام بيّن\", duration: \"00:34:00\", state: \"available\" },\n      { id: \"l7\", title: \"الحديث السابع: الدين النصيحة\", duration: \"00:22:00\", state: \"available\" },\n      { id: \"l8\", title: \"الحديث الثامن: حرمة دم المسلم وماله وعرضه\", duration: \"00:45:00\", state: \"available\" },\n    ],\n  },\n  {\n    id: \"day3\",\n    label: \"اليوم الثالث\",\n    lectures: [\n      { id: \"l9\", title: \"الحديث التاسع: من حسن إسلام المرء تركه ما لا يعنيه\", duration: \"00:31:00\", state: \"available\" },\n      { id: \"l10\", title: \"الحديث العاشر: لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه\", duration: \"00:38:00\", state: \"locked\" },\n      { id: \"l11\", title: \"الحديث الحادي عشر: دع ما يريبك إلى ما لا يريبك\", duration: \"00:26:00\", state: \"locked\" },\n    ],\n  },\n];\n\nfunction parseHMS(s) {\n  const [h, m, sec] = s.split(\":\").map(Number);\n  return h * 3600 + m * 60 + sec;\n}\n// \"01:15:00\" -> \"ساعة و 15 دقيقة\" / \"00:24:00\" -> \"24 دقيقة\" — always spells out hours and minutes explicitly.\nfunction formatDuration(hms) {\n  const [h, m] = hms.split(\":\").map(Number);\n  const parts = [];\n  if (h > 0) parts.push(h + (h === 1 ? \" ساعة\" : \" ساعات\"));\n  if (m > 0 || h === 0) parts.push(m + \" دقيقة\");\n  return parts.join(\" و \");\n}\n\nclass Component extends DCLogic {\n  state = {\n    completedIds: new Set([\"l1\", \"l2\"]),\n    currentId: \"l3\",\n    openDays: { day1: true, day2: false, day3: false },\n    sidebarOpen: true,\n    activeTab: \"overview\",\n    theaterMode: false,\n    accountMenuOpen: false,\n  };\n\n  flat() {\n    const out = [];\n    RAW_DAYS.forEach((d) => d.lectures.forEach((l) => out.push(l)));\n    return out;\n  }\n\n  selectLecture(id) {\n    const lec = this.flat().find((l) => l.id === id);\n    if (!lec || lec.state === \"locked\") return;\n    this.setState({ currentId: id, activeTab: \"overview\" });\n  }\n\n  toggleDone(id) {\n    this.setState((s) => {\n      const next = new Set(s.completedIds);\n      next.has(id) ? next.delete(id) : next.add(id);\n      return { completedIds: next };\n    });\n  }\n\n  step(dir) {\n    const flat = this.flat();\n    const idx = flat.findIndex((l) => l.id === this.state.currentId);\n    let next = idx;\n    do { next += dir; } while (flat[next] && flat[next].state === \"locked\");\n    if (flat[next]) this.setState({ currentId: flat[next].id, activeTab: \"overview\" });\n  }\n\n  renderVals() {\n    const viewport = this.props.viewport || \"desktop\";\n    const colorScheme = this.props.colorScheme || \"light\";\n    const isDesktop = viewport === \"desktop\";\n    const isTablet = viewport === \"tablet\";\n    const theaterMode = this.state.theaterMode;\n    const isRowLayout = (isDesktop || isTablet) && !theaterMode;\n\n    const vpConfig = {\n      desktop: { maxWidth: \"1240px\", padding: \"28px 24px 72px\", h1: \"var(--text-2xl)\", sectionGap: \"22px\", colGap: \"24px\", sidebarCol: \"340px\" },\n      tablet: { maxWidth: \"860px\", padding: \"22px 20px 56px\", h1: \"var(--text-xl)\", sectionGap: \"20px\", colGap: \"18px\", sidebarCol: \"300px\" },\n      mobile: { maxWidth: \"420px\", padding: \"16px 14px 48px\", h1: \"var(--text-lg)\", sectionGap: \"18px\", colGap: \"16px\", sidebarCol: \"1fr\" },\n    };\n    const cfg = vpConfig[viewport] || vpConfig.desktop;\n\n    const flat = this.flat();\n    const currentIdx = flat.findIndex((l) => l.id === this.state.currentId);\n    const currentRaw = flat[currentIdx] || flat[0];\n    const completedIds = this.state.completedIds;\n\n    const days = RAW_DAYS.map((d) => {\n      const total = d.lectures.length;\n      const done = d.lectures.filter((l) => completedIds.has(l.id)).length;\n      const allDone = done === total;\n      const totalSec = d.lectures.reduce((sum, l) => sum + parseHMS(l.duration), 0);\n      const open = !!this.state.openDays[d.id];\n      return {\n        id: d.id,\n        label: d.label,\n        open,\n        allDone,\n        checkBorder: allDone ? \"var(--surface-brand)\" : \"var(--border-default)\",\n        checkBg: allDone ? \"var(--surface-brand)\" : \"transparent\",\n        chevronIcon: open ? \"chevron-down\" : \"chevron-left\",\n        summaryLine: done + \" / \" + total + \" \\u00b7 \" + formatDuration(\n          [Math.floor(totalSec / 3600), Math.floor((totalSec % 3600) / 60), totalSec % 60]\n            .map((n) => String(n).padStart(2, \"0\")).join(\":\")\n        ),\n        toggleOpen: () => this.setState((s) => ({ openDays: { ...s.openDays, [d.id]: !s.openDays[d.id] } })),\n        lectures: d.lectures.map((l) => {\n          const done = completedIds.has(l.id);\n          const isCurrent = l.id === this.state.currentId;\n          const locked = l.state === \"locked\";\n          return {\n            id: l.id,\n            title: l.title,\n            durationLabel: formatDuration(l.duration),\n            done,\n            locked,\n            showCheckbox: !locked,\n            select: () => this.selectLecture(l.id),\n            toggleDone: (e) => { e.stopPropagation(); this.toggleDone(l.id); },\n            cursor: locked ? \"not-allowed\" : \"pointer\",\n            rowBg: isCurrent ? \"var(--ribaat-green-100)\" : \"transparent\",\n            rowBorder: isCurrent ? \"3px solid var(--ribaat-green-600)\" : \"3px solid transparent\",\n            titleColor: locked ? \"var(--text-muted)\" : isCurrent ? \"var(--text-brand)\" : \"var(--text-primary)\",\n            titleWeight: isCurrent ? \"var(--weight-semibold)\" : \"var(--weight-regular)\",\n            checkBorder: done ? \"var(--surface-brand)\" : \"var(--border-default)\",\n            checkBg: done ? \"var(--surface-brand)\" : \"var(--surface-card)\",\n          };\n        }),\n      };\n    });\n\n    const totalLectures = flat.length;\n    const totalDone = flat.filter((l) => completedIds.has(l.id)).length;\n\n    const currentLecture = {\n      title: currentRaw.title,\n      durationLabel: formatDuration(currentRaw.duration),\n      description: currentRaw.description || \"شرح مفصّل لهذا الحديث مع بيان معانيه وفوائده الفقهية والعقدية، ومناسبته لما قبله وما بعده من أحاديث الأربعين.\",\n      hasHadith: !!currentRaw.hasHadith,\n      hadithText: currentRaw.hadithText,\n      hadithSource: currentRaw.hadithSource,\n    };\n\n    const hasPrev = currentIdx > 0;\n    const hasNextRaw = currentIdx < flat.length - 1;\n    const nextLocked = hasNextRaw && flat[currentIdx + 1].state === \"locked\";\n    const hasNext = hasNextRaw && !nextLocked;\n\n    const questions = [\n      { asker: \"سالم العتيبي\", timestamp: \"منذ يومين\", text: \"هل يشترط استحضار النية عند كل عمل، أم تكفي النية العامة في أول العبادة؟\", hasAnswer: true,\n        answer: { name: \"د. أنس اليتامى\", text: \"تكفي النية العامة في أول العبادة ولا يشترط تكرارها في كل جزء منها، وهذا هو مقصود الحديث.\" } },\n      { asker: \"هند الرشيدي\", timestamp: \"منذ 5 أيام\", text: \"ما الفرق بين الهجرة إلى الله والهجرة إلى الدنيا المذكورة في شرح الحديث؟\", hasAnswer: true,\n        answer: { name: \"د. أنس اليتامى\", text: \"الهجرة إلى الله تكون بالنية الصادقة في طلب رضاه، وهجرة الدنيا ما كانت النية فيها لغرض مادي أو دنيوي كالزواج أو المال.\" } },\n    ];\n\n    const documents = [\n      { name: \"الأربعون النووية - النص الكامل.pdf\", icon: \"file-text\", size: \"1.2 MB\" },\n      { name: \"ملخص شرح اليوم الأول.pdf\", icon: \"file-text\", size: \"640 KB\" },\n      { name: \"شرائح العرض - اليوم الأول.pdf\", icon: \"presentation\", size: \"2.1 MB\" },\n    ];\n\n    const courseTitle = \"الأربعون النووية\";\n\n    // Theater mode stacks everything in one column with course content right under the video;\n    // side-by-side keeps the classic two-column layout; plain mobile keeps content above the curriculum list.\n    const showInlineSidebar = theaterMode;\n    const showSideSidebar = !theaterMode && (isRowLayout ? this.state.sidebarOpen : true);\n\n    const videoOuterStyle = theaterMode\n      ? \"position: relative; height: calc(100vw * 9 / 16);\"\n      : \"position: relative; aspect-ratio: 16/9;\";\n    const videoInnerStyle = theaterMode\n      ? \"position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vw * 9 / 16); background: #17150F; overflow: hidden; z-index: 40;\"\n      : \"position: absolute; inset: 0; background: #17150F; border-radius: var(--radius-lg); overflow: hidden;\";\n\n    return {\n      studentName: \"ماجد\",\n      themeAttr: colorScheme,\n      logoFilter: colorScheme === \"dark\" ? \"brightness(0) invert(1) opacity(0.9)\" : \"none\",\n      frameLabel: viewport + \" / \" + colorScheme,\n      containerMaxWidth: cfg.maxWidth,\n      mainPadding: cfg.padding,\n      h1Size: cfg.h1,\n      sectionGap: cfg.sectionGap,\n      colGap: cfg.colGap,\n      rowDirection: isRowLayout ? \"row\" : \"column\",\n      videoOuterStyle,\n      videoInnerStyle,\n      breadcrumbItems: [\n        { label: \"لوحة التحكم\", href: \"StudentDashboard.dc.html\" },\n        { label: courseTitle, href: \"#\" },\n        { label: currentLecture.title },\n      ],\n      courseTitle,\n      instructorName: \"أنس اليتامى\",\n      currentLecture,\n      hasPrev,\n      hasNext,\n      prevCursor: hasPrev ? \"pointer\" : \"not-allowed\",\n      nextCursor: hasNext ? \"pointer\" : \"not-allowed\",\n      prevOpacity: hasPrev ? 1 : 0.35,\n      nextOpacity: hasNext ? 1 : 0.35,\n      goPrev: () => this.step(-1),\n      goNext: () => this.step(1),\n      nextLabel: hasNext ? \"الدرس التالي\" : \"لا يوجد درس تالٍ\",\n      theaterMode,\n      theaterIcon: theaterMode ? \"minimize-2\" : \"maximize\",\n      theaterButtonLabel: theaterMode ? \"تصغير الفيديو\" : \"توسيع الفيديو لملء الشاشة\",\n      toggleTheater: () => this.setState((s) => ({ theaterMode: !s.theaterMode })),\n      showInlineToggle: isRowLayout,\n      toggleSidebar: () => this.setState((s) => ({ sidebarOpen: !s.sidebarOpen })),\n      showInlineSidebar,\n      showSideSidebar,\n      sidebarFlex: isDesktop ? \"0 0 340px\" : isTablet ? \"0 0 300px\" : \"1 1 auto\",\n      sidebarMinWidth: isRowLayout ? \"280px\" : \"0\",\n      sidebarMaxWidth: isRowLayout ? \"360px\" : \"none\",\n      sidebarStickyStyle: isRowLayout ? \"position: sticky; top: 12px;\" : \"\",\n      showPanelClose: isRowLayout,\n      sidebarMaxHeight: isRowLayout ? \"560px\" : \"none\",\n      sidebarOverflow: isRowLayout ? \"auto\" : \"visible\",\n      courseProgressLine: totalDone + \" / \" + totalLectures + \" دروس مكتملة\",\n      days,\n      tabItems: [\n        { value: \"overview\", label: \"نظرة عامة\" },\n        { value: \"qa\", label: \"أسئلة وأجوبة\" },\n        { value: \"documents\", label: \"الملفات\" },\n      ],\n      activeTab: this.state.activeTab,\n      setActiveTab: (v) => this.setState({ activeTab: v }),\n      isOverview: this.state.activeTab === \"overview\",\n      isQa: this.state.activeTab === \"qa\",\n      isDocuments: this.state.activeTab === \"documents\",\n      questions,\n      hasQuestions: questions.length > 0,\n      hasNoQuestions: questions.length === 0,\n      documents,\n      accountMenuOpen: this.state.accountMenuOpen,\n      toggleAccountMenu: () => this.setState((s) => ({ accountMenuOpen: !s.accountMenuOpen })),\n    };\n  }\n\n  componentDidMount() {\n    const tryIcons = () => { if (window.lucide) window.lucide.createIcons(); else setTimeout(tryIcons, 50); };\n    tryIcons();\n  }\n  componentDidUpdate() {\n    window.lucide && window.lucide.createIcons();\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
