<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/fonts.css">
  <link rel="stylesheet" href="../../_ds/ribaat-design-system-790e93d5-7bd6-442c-b481-e7b96973db45/tokens/colors.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #EAE6DA; }
    a { color: #4F6140; text-decoration: none; }
    a:hover { color: #3E4E32; }
  </style>
</helmet>

<section style="padding: 48px; font-family: var(--font-sans, sans-serif);">
  <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; flex-wrap: wrap;">
    <span style="font-family: var(--font-display, serif); font-size: 26px; font-weight: 700; color: #211F19;">One document</span>
    <span style="font-size: 13px; color: #635C48;">Desktop light, tablet dark.</span>
    <a href="Certificates%20Frames.dc.html" style="font-size: 13px;">all boards</a>
  </div>
  <span style="display: block; font-size: 12px; color: #82795F; margin-bottom: 34px; max-width: 1180px;">{{ blurb }}</span>

  <div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">

    <div id="2c" style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 9px; border-radius: 13px; background: #8C5F35; color: #FFFEFA; font-size: 13px; font-weight: 700;">2c</span>
        <span style="font-size: 15px; font-weight: 600; color: #211F19;">Desktop · Light</span>
        <span style="font-size: 13px; color: #635C48;">{{ progressLabel }}</span>
      </div>
      <div style="width: 1280px; border: 1px solid #C9BFA6; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(33,31,25,0.10);">
        <dc-import name="StudentCertificates" state="{{ certState }}" medal-art="{{ medalArt }}" slot-prefix="2c" viewport="desktop" color-scheme="light" hint-size="1280px,2000px"></dc-import>
      </div>
    </div>

    <div id="2d" style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 9px; border-radius: 13px; background: #8C5F35; color: #FFFEFA; font-size: 13px; font-weight: 700;">2d</span>
        <span style="font-size: 15px; font-weight: 600; color: #211F19;">Tablet · Dark</span>
        <span style="font-size: 13px; color: #635C48;">{{ progressLabel }}</span>
      </div>
      <div style="width: 834px; border: 1px solid #4A4536; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(33,31,25,0.18);">
        <dc-import name="StudentCertificates" state="{{ certState }}" medal-art="{{ medalArt }}" slot-prefix="2d" viewport="tablet" color-scheme="dark" hint-size="834px,2400px"></dc-import>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;studentProgress&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;لا شيء&quot;,&quot;متوسط&quot;,&quot;مكتمل&quot;],&quot;default&quot;:&quot;متوسط&quot;,&quot;tsType&quot;:&quot;'لا شيء'|'متوسط'|'مكتمل'&quot;,&quot;section&quot;:&quot;حال الطالب&quot;},&quot;medalArt&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;وسام بشريطة&quot;,&quot;ميدالية بإكليل&quot;,&quot;خاتم نجمي&quot;,&quot;بلا صورة&quot;],&quot;default&quot;:&quot;وسام بشريطة&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;صورة الوسام&quot;}}">
const MAP = {
  "لا شيء": {
    state: "empty",
    label: "طالب بلا وثائق",
    blurb: "No document yet. All three programs — رباط الحنابلة، رباط الشافعية، رباط المالكية — keep their شهادة اجتياز squares in place, deactivated, so the record reads as a path not yet begun."
  },
  "متوسط": {
    state: "single",
    label: "تقدّم متوسط",
    blurb: "One إجازة بالسند المتصل and no شهادة اجتياز yet. The شهادة اجتياز squares stay in place, deactivated, so the record reads as a path in progress rather than a gap."
  },
  "مكتمل": {
    state: "full",
    label: "برنامج مُتمّ",
    blurb: "رباط الحنابلة complete (program certificate plus its three level certificates), رباط الشافعية in its second level, رباط المالكية not enrolled — beside nine إجازات بالسند المتصل."
  }
};

class Component extends DCLogic {
  renderVals() {
    const rec = MAP[this.props.studentProgress ?? "متوسط"] || MAP["متوسط"];
    return {
      certState: rec.state,
      progressLabel: rec.label,
      blurb: rec.blurb,
      medalArt: this.props.medalArt ?? "وسام بشريطة"
    };
  }
}
</script>
</body>
</html>
