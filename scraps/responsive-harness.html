<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ribaat — device widths</title>
<style>
  body { margin: 0; background: #2a2724; font: 12px/1.4 ui-monospace, monospace; color: #cfc7ba; padding: 16px; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 6px; }
  iframe { border: 0; background: #fff; display: block; }
  .phone iframe { width: 390px; height: 900px; }
  .tabletP iframe { width: 834px; height: 900px; }
  select { font: inherit; padding: 4px; margin-bottom: 12px; }
</style>
</head>
<body>
<select id="pick"></select>
<div class="row">
  <figure class="phone"><figcaption>phone 390</figcaption><iframe id="f1" title="phone"></iframe></figure>
  <figure class="tabletP"><figcaption>tablet 834</figcaption><iframe id="f2" title="tablet"></iframe></figure>
</div>
<script>
  const pages = ["student/StudentDashboard","student/CourseCatalogue","student/CourseDetails","student/LessonPlayer","student/StudentPaths","student/StudentCertificates","student/ExamPage","student/ExamTaking","student/RibaatAuth","student/CourseEnrollment","student/ProgramEnrollment","teacher/TeacherOverview v3","teacher/TeacherStudents","teacher/TeacherStudentDetail"];
  const pick = document.getElementById("pick");
  pages.forEach(p => { const o = document.createElement("option"); o.value = p; o.textContent = p; pick.appendChild(o); });
  function load() {
    const src = "../ui_kits/" + pick.value + ".dc.html";
    document.getElementById("f1").src = src;
    document.getElementById("f2").src = src;
  }
  pick.addEventListener("change", load);
  load();
</script>
</body>
</html>
